<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4E392C" />
  <meta name="description" content="SZN4.DESIGN — Sabrina's UX/UI, ecommerce, CRO and product design portfolio." />
  <title>SZN4.DESIGN</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="scroll-cue" id="scrollCue" aria-hidden="true">
    <span>SCROLL TO EXPLORE</span>
    <span class="scroll-arrow">↓</span>
  </div>

  <main class="scroll-stage" aria-label="SZN4 Design introduction">

    <section class="zoom-line eyebrow" data-max-scale="1.08" data-min-scale="0.80">
      <div class="line-inner">WELCOME TO MY CORNER OF THE INTERNET</div>
    </section>

    <section class="zoom-line intro" data-max-scale="1.10" data-min-scale="0.80">
      <div class="line-inner">HI, I'M SABRINA</div>
    </section>

    <section class="zoom-line statement" data-max-scale="1.14" data-min-scale="0.78">
      <div class="line-inner">I design digital experiences around how people actually behave.</div>
    </section>

    <section class="zoom-line disciplines" data-max-scale="1.06" data-min-scale="0.82">
      <div class="line-inner">UX/UI <span>·</span> ECOMMERCE <span>·</span> CRO <span>·</span> PRODUCT DESIGN</div>
    </section>

    <section class="zoom-line circles" data-max-scale="1.08" data-min-scale="0.84">
      <div class="line-inner" aria-hidden="true">
        <span class="circle"></span>
        <span class="circle"></span>
        <span class="circle"></span>
        <span class="circle"></span>
      </div>
    </section>

    <section class="zoom-line closing" id="closingLine" data-max-scale="1.08" data-min-scale="0.82">
      <div class="line-inner">CURRENTLY IN: SZN4</div>
    </section>

    <section class="cta-section" id="ctaSection" aria-label="Portfolio navigation">
      <div class="cta-card">
        <p class="cta-kicker">KEEP EXPLORING</p>
        <div class="cta-actions">
          <a class="button button-primary" href="https://szn4.design/ui-ux-projects">
            VIEW PROJECTS <span aria-hidden="true">→</span>
          </a>
          <a class="button button-secondary" href="/about-me/">ABOUT ME</a>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
